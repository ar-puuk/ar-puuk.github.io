project:
  type: website
  output-dir: docs
  # left-aligns code in the Word versions (see the script for why)
  post-render: scripts/fix-docx.py
  # render:
  #   - "*.qmd"
  #   - "!posts/utah-bikeways/"

website:
  title: "Pukar Bhandari"
  description: Pukar Bhandari is a Transportation Planner and Data Scientist working at the intersection of Transportation Modeling, Economic Impact Analysis, and Data Science.
  favicon: "assets/images/pb-logo.svg"
  site-url: "https://ar-puuk.github.io"
  llms-txt: true
  reader-mode: true
  search:
    location: navbar
    type: overlay
    keyboard-shortcut: ["/"]
    copy-button: true
    show-item-context: true
  # show draft: true pages (flagged with a Draft banner); use "gone" to hide them
  draft-mode: visible

  repo-url: "https://github.com/ar-puuk/ar-puuk.github.io"
  repo-branch: master
  # "Edit this page" and "Report an issue" links in the page footer
  repo-actions: [edit, issue]

  # page-navigation: false
  # back-to-top-navigation: false
  # margin-header: subscribe.html

  announcement:
    icon: megaphone
    dismissable: true
    content: "**New:** [Demographic Profiles](/work/community-profiles/){.no-external target='_self'}, a zero-backend, map-first dashboard of Census and economic indicators for Utah."
    type: primary
    position: below-navbar

  twitter-card:
    creator: "@arpuuk"
    site: "@arpuuk"
    card-style: summary_large_image

  open-graph: true
  cookie-consent: false

  navbar:
    logo: assets/images/pb-logo.svg
    collapse-below: xl
    # left:
    #   - href: about.qmd
    #     # icon: person-circle
    #     text: About
    #   - href: projects.qmd
    #     # icon: link-45deg
    #     text: Projects
    #   - href: resume/index.qmd
    #     # icon: file-earmark-text-fill
    #     text: Resume

    right:
      - href: about.qmd
        # icon: person-circle
        text: About
      - href: projects.qmd
        # icon: link-45deg
        text: Projects
      - href: research/index.qmd
        # icon: flask-fill
        text: Research
      - text: Socials
        menu:
          - icon: github
            text: Github
            href: https://github.com/ar-puuk/
            target: _blank
          - icon: linkedin
            text: LinkedIn
            href: https://www.linkedin.com/in/arpuuk
            target: _blank
          - icon: mastodon
            text: Mastodon
            href: https://urbanists.social/@arpuuk
            target: _blank
          - icon: bluesky
            text: Bluesky
            href: https://bsky.app/profile/arpuuk.bsky.social
            target: _blank
          - icon: envelope-fill
            text: E-mail
            href: mailto:pukar.bhandari@outlook.com
            target: _blank
      - icon: rss
        href: projects.xml

  page-footer:
    left: '&copy; 2025&ndash;<span id="footer-year">2026</span> Pukar Bhandari<span class="footer-sep"> &#8729; </span>Made with [{{< fa brands r-project title="R Project" >}}](https://www.r-project.org/about.html){target=_blank}, [<img src="https://quarto.org/favicon.png" width="14" alt="Quarto">](https://quarto.org/){target=_blank}, [{{< fa brands git-alt title="Git alt logo" >}}](https://git-scm.com/){target=_blank} and [{{< fa brands github title="GitHub octocat logo" >}}](https://github.com/){target=_blank}'
    center: |
          <a href="https://www.linkedin.com/in/arpuuk" title="LinkedIn" target="_blank" rel="noopener">{{< fa brands linkedin >}}</a>
          &nbsp;
          <a href="https://github.com/ar-puuk/" title="github" target="_blank" rel="noopener">{{< fa brands github >}}</a>
          &nbsp;
          <a href="https://bsky.app/profile/arpuuk.bsky.social" title="Bluesky" target="_blank" rel="noopener">{{< fa brands bluesky >}}</a>
          &nbsp;
          <a href="https://urbanists.social/@arpuuk" title="Mastodon" target="_blank" rel="noopener">{{< fa brands mastodon >}}</a>
          &nbsp;
          <a href="https://orcid.org/0000-0002-1043-2937" title="orcid" target="_blank" rel="noopener">{{< ai orcid >}}</a>
          &nbsp;
          <a href="https://scholar.google.com/citations?user=vnwRlAsAAAAJ&hl=en" title="Google Scholar" target="_blank"rel="noopener">{{< ai google-scholar >}}</a>
          &nbsp;
          <a href="mailto:pukar.bhandari@outlook.com" title="E-mail" target="_blank" rel="noopener">{{< fa envelope >}}</a>
    right:
      - text: Contact
        aria-label: Contact Form
        href: contact.qmd
      - text: License
        aria-label: License Details
        href: license.qmd
format:
  html:
    respect-user-color-scheme: true
    theme:
      light:
        # - "flatly"
        - cosmo
        - assets/theme/index.scss
        - assets/theme/theme-light.scss
      dark:
        # - "darkly"
        - assets/theme/index.scss
        - assets/theme/theme-dark.scss
    mainfont: "Poppins"
    monofont: "Fira Code"
    css: assets/css/index.css
    include-in-header:
      - _includes/preload-fonts.html
    include-after-body:
      - _includes/footer-year.html
    link-external-icon: true
    link-external-newwindow: true
    smooth-scroll: true
    citations-hover: true
    footnotes-hover: true
    email-obfuscation: javascript
    lang: en-US
    lightbox: auto

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: auto

# success and fail callouts, on top of the five Quarto ships
filters:
  - at: pre-ast
    path: assets/filters/custom-callouts.lua
