# options specified here will apply to all posts in this folder

# Enable banner style title blocks
title-block-banner: true

# Article page layout
page-layout: article

# Specify post formats
format:
  html:
    toc: true
    toc-location: left
    fig-format: svg
    number-sections: true
    number-depth: 2
    html-math-method: katex
    code-link: true
    code-tools: true
    code-annotations: select
    css: ../assets/css/app-embed.css
    include-after-body: ../_includes/app-embed-js.html
  typst:
    fig-format: png
    knitr:
      opts_chunk:
        dev: ragg_png
    toc: true
    number-sections: true
    number-depth: 2
    # Site look for the PDFs: Quarto's own template extended with a title banner, running
    # header/footer and the site's colours (see assets/typst/typst-template.typ).
    template-partials:
      - ../assets/typst/typst-template.typ
      - ../assets/typst/typst-show.typ
    font-paths:
      - ../assets/typst/fonts
    mainfont: Poppins
    codefont: Fira Code
    fontsize: 9.5pt
    linkcolor: "#B8531F"
    margin:
      x: 0.9in
      y: 0.85in
  docx:
    # Site look for the Word versions (generated by assets/docx/build_reference.py)
    reference-doc: ../assets/docx/reference.docx
    fig-format: png
    knitr:
      opts_chunk:
        dev: ragg_png
    toc: true
    number-sections: true
    number-depth: 2

execute:
  eval: true
  warning: false
  message: false

format-links:
  - format: typst
    text: PDF
    icon: file-pdf
  - docx

engine: knitr
# html figures are SVG (fig-format); a global knitr dev would override that, so the
# raster device is set per format below for PDF and Word.
# Charts that draw very many shapes (large sf maps) make huge SVGs: give those chunks
# "#| fig-format: png", "#| dev: ragg_png" and "#| fig-dpi: 192" (see posts/nepal-population-density).

citation: true
page-navigation: true

# Show a "Modified" date taken from the file modification time
date-modified: last-modified
