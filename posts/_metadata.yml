# options specified here will apply to all posts in this folder

# Enable banner style title blocks
title-block-banner: true

# Article page layout
page-layout: article

# Specify post formats
format:
  html:
    toc: true
    toc-location: left
    number-sections: true
    number-depth: 2
    html-math-method: katex
    code-link: true
    code-tools: true
    code-annotations: select
    css: ../assets/css/app-embed.css
    include-after-body: ../_includes/app-embed-js.html
  typst:
    toc: true
    number-sections: true
    number-depth: 2
  docx:
    toc: true
    number-sections: true
    number-depth: 2

execute:
  eval: true
  warning: false
  message: false

format-links:
  # - html
  - format: typst
    text: PDF
    icon: file-pdf
  - docx

engine: knitr
knitr:
  opts_chunk:
    dev: ragg_png

citation: true
page-navigation: true

# Show a "Modified" date taken from the file modification time
date-modified: last-modified
