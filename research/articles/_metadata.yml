# options specified here apply to every journal article in this folder

# emit Google Scholar citation_* meta tags
google-scholar: true

# "Cite this article" block (BibTeX/APA) at the end of the page; authors, title and
# date come from each article's front matter
citation: true

# link row (Published version, Project Website, ...) at the top of the page, from pub-info.links
filters:
  - ../../assets/filters/pub-links.lua
format:
  html:
    css: ../../assets/css/pub-links.css
